<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>
  <!-- Ethernet Jack Shape -->
  <rect x="36" y="32" width="56" height="42" rx="8" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <rect x="48" y="74" width="32" height="16" rx="3" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <!-- Pin contacts -->
  <line x1="46" y1="36" x2="46" y2="48" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="36" x2="54" y2="48" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="36" x2="62" y2="48" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="36" x2="70" y2="48" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="36" x2="78" y2="48" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lightning Bolt Overlay -->
  <path d="M72 16 L40 68 L62 68 L56 112 L88 58 L66 58 Z" fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
</svg>
